                        <th colspan="2">Employé</th>

                        <th>Porte</th>
                        <th>Restaurant</th>
                        <th>Exceptions</th>
                        <th colspan="2">Actions</th>
                    </tr>
                </thead>
                <tbody id="attendance-list">
          
          </tbody>
          </table>
          </div>
          
          <button id="load-more" class="btn btn-primary mt-3">Load More</button>
        </div>
